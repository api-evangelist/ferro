apis:
  - aid: ferro:sec-edgar-filings
    name: SEC EDGAR Filings (Ferro Corporation, CIK 0000035214)
    description: >-
      Machine-readable historical filing data for Ferro Corporation is available from
      the U.S. Securities and Exchange Commission, not from the company. The SEC EDGAR
      submissions API returns the full filing history for CIK 0000035214 (FERRO CORP)
      as JSON — 10-K, 10-Q, 8-K and proxy filings through the 2022 acquisition, the
      Form 15-12B deregistration of 2022-05-02, and beneficial-ownership amendments
      into 2023. This is a third-party government API listed here because it is the
      only real programmatic access to this company's data; Ferro no longer files.
    humanURL: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    baseURL: https://data.sec.gov
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    tags:
      - Filings
      - SEC EDGAR
      - Third Party
    tags_raw:
      - Filings
      - SEC EDGAR
      - Third-Party
    properties:
      - type: Documentation
        url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      - type: APIReference
        url: https://data.sec.gov/submissions/CIK0000035214.json
    x-evidence:
      verified: '2026-09-17'
      method: fetched documentation and called the endpoint
      documentation: >-
        The SEC's EDGAR APIs page (HTTP 200) documents RESTful JSON APIs on data.sec.gov
        — https://data.sec.gov/submissions/CIK##########.json plus the XBRL
        companyconcept, companyfacts and frames APIs. No authentication or API key is
        required; a declared User-Agent and a 10-request-per-second ceiling are the
        stated fair-access terms.
      endpoint_check: >-
        GET https://data.sec.gov/submissions/CIK0000035214.json returned HTTP 200 with
        JSON naming "FERRO CORP", no current ticker, and 1,000 recent filings whose
        latest entries are an SC 13G/A dated 2023-02-10 and the 15-12B dated
        2022-05-02.
