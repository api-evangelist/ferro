description: >-
  Ferro Corporation was a Cleveland-area, NYSE-listed (FOE) Fortune 1000 producer of
  functional coatings, color solutions, glass enamels, pigments and electronic
  materials. In April 2022 it was acquired by Prince International (American
  Securities) and merged with Prince and Chromaflo to form Vibrantz Technologies
  (vibrantz.com); Ferro filed a Form 15 with the SEC on 2022-05-02 and ferro.com now
  301-redirects to vibrantz.com. Neither the legacy Ferro brand nor Vibrantz publishes
  a developer program, an API reference or a machine-readable contract: api.ferro.com
  and developer.ferro.com do not resolve, vibrantz.com answers 404 on every developer,
  OpenAPI and /.well-known/ path probed on 2026-09-17, and its only machine-readable
  surfaces are a Yoast-generated llms.txt, an RSS feed and the default WordPress
  /wp-json/ index. Machine-readable company data exists only through third-party
  channels — Ferro's historical SEC filings (CIK 0000035214) remain on the SEC's own
  EDGAR APIs.
